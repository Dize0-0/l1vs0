<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>l1vs0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 2rem;
      margin: 0;
    }

    .container {
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
    }

    /* АВАТАР */
    .avatar-wrap {
      animation: fadeIn 1s ease-out;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .avatar:hover {
      transform: scale(1.04);
    }

    /* ИМЯ */
    .name-section {
      text-align: center;
      animation: fadeIn 1s ease-out 0.15s both;
    }

    .name {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -2px;
      color: #ffffff;
      text-transform: lowercase;
      line-height: 1;
    }

    /* СЕКЦИИ */
    .section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      animation: fadeIn 1s ease-out 0.25s both;
    }

    .section-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #444444;
    }

    /* КОНТАКТЫ */
    .contacts {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: #ffffff;
      font-weight: 500;
      font-size: 0.95rem;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .contact-link i {
      font-size: 1rem;
      color: #ffffff;
      transition: transform 0.3s ease;
    }

    .contact-link:hover {
      opacity: 0.5;
      transform: translateX(5px);
    }

    .contact-link:hover i {
      transform: scale(1.2);
    }

    /* СЕТАП */
    .setup-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .gear-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.3s ease, opacity 0.3s ease;
      cursor: default;
    }

    .gear-row:hover {
      transform: translateX(8px);
      opacity: 0.65;
    }

    .gear-left {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-weight: 500;
      font-size: 0.95rem;
      color: #ffffff;
    }

    .gear-left i {
      color: #ffffff;
      font-size: 0.85rem;
      width: 1.2rem;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .gear-row:hover .gear-left i {
      transform: rotate(-8deg) scale(1.15);
    }

    .gear-price {
      font-weight: 600;
      font-size: 0.95rem;
      color: #ffffff;
      transition: letter-spacing 0.3s ease;
    }

    .gear-row:hover .gear-price {
      letter-spacing: 1.5px;
    }

    /* БИО */
    .bio {
      font-size: 0.7rem;
      color: #4a4a4a;
      letter-spacing: 1px;
      font-weight: 400;
      text-align: center;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-all;
      max-width: 400px;
      transition: color 0.5s ease;
      animation: fadeIn 1s ease-out 0.4s both;
    }

    .bio:hover {
      color: #777777;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .container {
        gap: 2rem;
      }
      .name {
        font-size: 2.4rem;
      }
      .bio {
        font-size: 0.65rem;
        max-width: 300px;
      }
    }
  </style>
</head>
<body>

  </div>
</body>
</html>
