<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>l1vs0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            color: #e0e0e0;
        }

        .card {
            max-width: 480px;
            width: 100%;
            background: #0a0a0c;
            border: 1px solid #18181e;
            border-radius: 32px;
            padding: 40px 32px 32px;
            box-shadow: 0 25px 60px -12px rgba(0,0,0,1);
            transition: 0.3s ease;
        }

        .card:hover {
            border-color: #282832;
        }

        .profile-head {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #141418;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2a2a32;
            flex-shrink: 0;
            transition: 0.3s;
        }

        .avatar:hover {
            border-color: #5a5aff;
            transform: scale(1.03);
        }

        .name-block h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .name-block .handle {
            font-size: 14px;
            font-weight: 400;
            color: #6a6a7a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-verified {
            background: #14141a;
            border-radius: 100px;
            padding: 2px 12px 2px 8px;
            font-size: 11px;
            font-weight: 500;
            color: #8a8a9a;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid #24242c;
        }

        .badge-verified i {
            color: #5a5aff;
            font-size: 11px;
        }

        .bio-text {
            font-size: 13px;
            line-height: 1.8;
            color: #7a7a8a;
            margin-bottom: 28px;
            padding: 14px 18px;
            background: #0d0d10;
            border-radius: 16px;
            border: 1px solid #141418;
            text-align: center;
            letter-spacing: 0.5px;
            word-break: break-word;
        }

        .bio-text span {
            color: #a0a0b0;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #4a4a5a;
            margin: 28px 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #141418;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #5a5a7a;
            font-size: 14px;
        }

        .spec-grid {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #0c0c10;
            font-size: 14px;
        }

        .spec-row:last-child {
            border-bottom: none;
        }

        .spec-row .label {
            color: #5a5a6a;
            font-weight: 400;
        }

        .spec-row .value {
            font-weight: 400;
            color: #d0d0d8;
        }

        .spec-row .price {
            color: #8a8aff;
            font-weight: 500;
            margin-left: 6px;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: #0d0d10;
            border-radius: 14px;
            text-decoration: none;
            color: #c0c0c8;
            font-weight: 400;
            transition: all 0.25s ease;
            border: 1px solid #141418;
            font-size: 14px;
        }

        .link-btn:hover {
            background: #14141a;
            border-color: #2a2a32;
            transform: translateX(4px);
        }

        .link-btn .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-btn i {
            font-size: 18px;
            width: 28px;
            text-align: center;
            color: #6a6a8a;
            transition: 0.2s;
        }

        .link-btn:hover i {
            color: #8a8aff;
        }

        .link-btn .arrow {
            color: #3a3a4a;
            font-size: 13px;
            transition: 0.2s;
        }

        .link-btn:hover .arrow {
            color: #8a8aff;
            transform: translateX(2px);
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: #2a2a32;
            border-top: 1px solid #141418;
            padding-top: 18px;
            letter-spacing: 0.5px;
        }

        .footer i {
            color: #3a3a4a;
            font-size: 5px;
            vertical-align: middle;
            margin: 0 6px;
        }

        @media (max-width: 500px) {
            .card { padding: 24px 16px; }
            .profile-head { gap: 14px; }
            .avatar { width: 64px; height: 64px; }
            .name-block h1 { font-size: 20px; }
            .bio-text { font-size: 12px; padding: 12px 14px; }
            .spec-row { font-size: 13px; flex-wrap: wrap; gap: 4px; }
            .link-btn { padding: 12px 14px; font-size: 13px; }
        }
    </style>
</head>
